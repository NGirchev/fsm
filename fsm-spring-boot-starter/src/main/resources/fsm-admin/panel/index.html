<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FSM administration</title>
  <link rel="stylesheet" href="./ui/admin.css">
  <script type="module" src="./ui/admin.js"></script>
</head>
<body>
  <header><h1>FSM administration</h1><label>Flow <select id="flow-key" aria-label="Flow" disabled></select></label></header>
  <main>
    <div id="flow-message" role="status">Loading flows…</div>
    <div class="flow-toolbar">
      <label>Version <select id="flow-version" aria-label="Version" disabled></select></label>
      <button id="create-draft" disabled>Create draft</button>
      <button id="save-draft" disabled>Save draft</button>
      <button id="publish" disabled>Publish</button>
      <button id="activate" disabled>Make active</button>
      <button id="delete-draft" disabled>Delete draft</button>
      <button id="discard" hidden>Discard changes</button>
      <button id="retry">Retry</button>
    </div>
    <iframe id="flow-editor" title="FSM editor"></iframe>
  </main>
</body>
</html>
