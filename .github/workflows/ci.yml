name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Run code quality checks (detekt)
      run: ./gradlew detekt

    - name: Build project
      run: ./gradlew build -x test

    - name: Run tests
      run: ./gradlew test

    - name: Generate test coverage report
      run: ./gradlew jacocoTestReport

    - name: Verify test coverage
      run: ./gradlew jacocoTestCoverageVerification

    - name: Upload test coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: |
          fsm/build/reports/jacoco/test/html/**
          fsm/build/reports/jacoco/test/jacocoTestReport.xml
          fsm-spring-boot-starter/build/reports/jacoco/test/html/**
          fsm-spring-boot-starter/build/reports/jacoco/test/jacocoTestReport.xml

    - name: Upload detekt reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: detekt-reports
        path: fsm/build/reports/detekt/**

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-artifacts
        path: fsm/build/libs/*.jar

  editor-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fsm-visual-editor/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        working-directory: fsm-visual-editor
      - run: npx playwright install --with-deps chromium
        working-directory: fsm-visual-editor
      - run: npm run test:e2e
        working-directory: fsm-visual-editor
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: editor-browser-failures
          path: |
            fsm-visual-editor/playwright-report/
            fsm-visual-editor/test-results/
            fsm-visual-editor/e2e-server.log

  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v4
