services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fsm
      POSTGRES_USER: fsm
      POSTGRES_PASSWORD: fsm
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsm -d fsm"]
      interval: 2s
      timeout: 2s
      retries: 20
  # The editor is a separate static server, as it would be in its own pod.
  editor:
    build: ../fsm-visual-editor
    ports:
      - "127.0.0.1:18090:80"
