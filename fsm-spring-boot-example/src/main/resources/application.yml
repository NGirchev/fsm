spring:
  application:
    name: fsm-spring-boot-example
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fsm}
    username: ${DB_USER:fsm}
    password: ${DB_PASSWORD:fsm}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
