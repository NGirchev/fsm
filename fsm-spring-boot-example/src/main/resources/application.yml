spring:
  application:
    name: fsm-spring-boot-example
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:55439}/fsm}
    username: ${DB_USER:fsm}
    password: ${DB_PASSWORD:fsm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}

fsm:
  example:
    runner:
      enabled: ${FSM_DEMO_RUNNER_ENABLED:false}
